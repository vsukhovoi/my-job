  /ext/v1/accounts/{iban}/balances:
    get:
      tags:
        - account-details
      operationId: get-account-balances
      summary: Отримання історії балансів рахунку за період
      description: |
        Сервіс для отримання історії балансів корпоративного рахунку за вказаний період часу.
        Повертає масив балансів на кожну дату в межах зазначеного періоду.
        Для кожної дати вказується поточний баланс та прапорець `isFinal`, який сигналізує про те,
        що баланс на цю дату більше не зміниться (всі операції за цей день остаточно проведені).
      parameters:
        - name: iban
          in: path
          schema:
            type: string
          required: true
          description: IBAN корпоративного рахунку, для якого необхідно отримати історію балансів
          example: UA293220010000026002700000002
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: dateFrom
          in: query
          description: "Дата початку періоду для отримання історії балансів у форматі ISO 8601 (YYYY-MM-DD)"
          required: true
          schema:
            type: string
            format: date
          example: "2025-01-01"
        - name: dateTo
          in: query
          description: "Дата кінця періоду для отримання історії балансів у форматі ISO 8601 (YYYY-MM-DD)"
          required: true
          schema:
            type: string
            format: date
          example: "2025-01-31"
      responses:
        '200':
          description: Успішно отримано історію балансів. Повертається масив об'єктів з балансами на кожну дату в межах зазначеного періоду
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalancesResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/payslips/batch:
    post:
      tags:
        - payslips
      summary: Пакетне завантаження розрахункових листів
      description: |
        Дозволяє завантажувати розрахункові листи для співробітників пакетами (частинами).

        **Як це працює:**
        - Відправте дані співробітників за певний період (наприклад, січень 2026)
        - Можна відправити всіх співробітників одразу або частинами (наприклад, по 100-500 за раз)
        - Всі запити за один період автоматично об'єднуються в один імпорт
        - Якщо співробітник вже існує - його дані оновлюються, якщо новий - додається
        - Якщо в одному пакеті є дублікати - використовується останнє значення

        **Що повертається:**
        - Статистика по поточному пакету (скільки оброблено, скільки успішно, скільки помилок)
        - Загальна статистика по всіх пакетах за цей період
        - Список співробітників, які не вдалося обробити (якщо є)

        **Обробка відбувається синхронно** - відповідь приходить одразу після обробки.
      operationId: batchUploadPayslips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPayslipRequest'
            example:
              period: "2026-01"
              employees:
                - identification: "3262002039"
                  attributes:
                    - attributeName: "Базова зарплата"
                      value: "50000"
                      sortOrder: 1
                      attributeSuffix: "грн"
                    - attributeName: "Премія"
                      value: "10000"
                      sortOrder: 2
                      attributeSuffix: "грн"
                - identification: "1234567890"
                  attributes:
                    - attributeName: "Базова зарплата"
                      value: "35000"
                      sortOrder: 1
                      attributeSuffix: "грн"
      responses:
        '200':
          description: Пакет успішно оброблено (можуть бути часткові помилки для окремих співробітників)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/BatchPayslipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - payslips
      summary: Видалення розрахункових листів за ідентифікаціями
      description: |
        Видаляє розрахункові листи з імпорту за списком ідентифікацій співробітників.
        Видаляються тільки ті розрахункові листи, які існують в імпорті за вказаний період.
        Ідентифікації, які не знайдені, ігноруються.
      operationId: batchDeletePayslips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePayslipsRequest'
            example:
              period: "2026-01"
              identifications:
                - "3262002039"
                - "1234567890"
      responses:
        '204':
          description: Розрахункові листи успішно видалено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ext/v1/payslip-imports/status:
    get:
      tags:
        - payslips
      summary: Отримання статусу імпорту
      description: |
        Повертає поточний статус імпорту та статистику обробки.
        Можна шукати за ідентифікатором імпорту або за періодом.
        Легкий ендпоінт для перевірки прогресу без завантаження всіх даних по співробітниках.
      operationId: getImportStatus
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            format: YearMonth
          description: Період у форматі YYYY-MM
          example: "2026-01"
      responses:
        '200':
          description: Статус імпорту отримано успішно
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/ImportStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ext/v1/payslip-imports:
    delete:
      tags:
        - payslips
      summary: Видалення імпорту розрахункових листів
      description: |
        Видаляє імпорт з усіма розрахунковими листами за вказаний період.
        Операція незворотна.
      operationId: deleteImport
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            format: YearMonth
          description: Період у форматі YYYY-MM
          example: "2026-01"
      responses:
        '204':
          description: Імпорт успішно видалено
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ext/v1/payslip-imports/send:
    post:
      tags:
        - payslips
      summary: Відправка розрахункових листів співробітникам
      description: |
        Робить розрахункові листи доступними для перегляду співробітниками в мобільному застосунку.
        Після відправки статус імпорту змінюється на SENT.
      operationId: sendToMobile
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            format: YearMonth
          description: Період у форматі YYYY-MM
          example: "2026-01"
      responses:
        '200':
          description: Розрахункові листи успішно відправлено співробітникам
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required:
                      - period
                      - status
                      - employeesSent
                    properties:
                      period:
                        type: string
                        format: YearMonth
                        example: "2026-01"
                      status:
                        type: string
                        enum: [ SENT ]
                      employeesSent:
                        type: integer
                        description: Кількість співробітників, яким відправлено розрахункові листи
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ext/v1/payslips/pdf:
    get:
      tags:
        - payslips
      summary: Генерація PDF розрахункового листа
      description: |
        Генерує PDF розрахункового листа для співробітника за ІПН/паспортом і періодом.
      operationId: generatePayslipPdfByIdentification
      parameters:
        - name: identification
          in: query
          required: true
          schema:
            type: string
          description: ІПН або номер паспорта співробітника
          example: "3262002039"
        - name: period
          in: query
          required: true
          schema:
            type: string
            format: YearMonth
          description: Період у форматі YYYY-MM
          example: "2026-01"
      responses:
        '200':
          description: PDF успішно згенеровано
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Помилка генерації PDF або дані компанії недоступні
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  responses:
    BadRequest:
      description: Bad Request (invalid request parameters)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Data not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: Not Acceptable (invalid Accept header)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict (duplicate request provided)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Внутрішня помилка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          description: Код помилки
        errorDescription:
          type: string
          description: Текст (опис) помилки
    StatementItem:
      type: object
      properties:
        id:
          type: string
          description: Ідентифікатор платежу
          example: ea4f9218-d134-431a-9169-88acab4454c9
        externalReference:
          type: string
          description: Ідентифікатор платежу у системі клієнта
          example: my-own-pretty-external-reference
        time:
          type: integer
          description: Час створення транзакції в секундах в форматі Unix time
          format: int64
          example: 1719472805
        completedTime:
          type: integer
          description: Час проведення транзакції в секундах в форматі Unix time
          format: int64
          example: 1719577881
        description:
          type: string
          description: Призначення операції
          example: "Оплата за щось цікаве 😊"
        amount:
          type: integer
          format: int64
          description: "Сума у валюті рахунку в мінімальних одиницях валюти (копійках, центах). 
          Якщо сума від'ємна - то це списання з рахунку. Якщо зі знаком плюс - то поповнення рахунку"
          example: 12345
        currencyCode:
          type: string
          description: Код валюти рахунку відповідно ISO 4217
          example: '980'
        receiptId:
          type: string
          description: Номер квитанции для check.gov.ua. Поле може бути відсутнім
          example: XXXX-XXXX-XXXX-XXXX
        counterEdrpou:
          type: string
          description: "ЄДРПОУ контрагента. Для вхідних операцій - ЄДРПОУ того хто поповнив рахунок. 
          Для вихідних - ЄДРПОУ того, куди були перераховані кошти"
          example: 21133352
        counterIban:
          type: string
          description: "IBAN контрагента. Для вхідних операцій - IBAN рахунок з якого було виконане поповнення. 
          Для вихідних - IBAN рахунок, на який було перераховано кошти"
          example: UA293220010000026000000000001
        counterName:
          type: string
          description: "Найменування контрагента. Для вхідних операцій - найменування контрагента, який здійснив поповнення рахунку. 
          Для вихідних - найменування контрагента, якому було перераховано кошти"
          example: "ТОВАРИСТВО З ОБМЕЖЕНОЮ ВІДПОВІДАЛЬНІСТЮ ..."
        reverse:
          type: boolean
          description: Ознака транзакції реверсу
          example: false
        status:
          type: string
          description: Статус операції
          example: "DONE"
          enum:
            - DONE
            - PENDING
            - DECLINED
    PaymentRequestReceiver:
      type: object
      required:
        - iban
        - edrpou
        - name
      properties:
        iban:
          example: UA293220010000026000000000001
          type: string
          description: IBAN рахунку на який треба перерахувати кошти
        edrpou:
          example: 21133352
          type: string
          description: "ЕДРПОУ отримувача коштів"
        name:
          type: string
          description: "Назва отримувача коштів (назва компанії або ПІБ фізичної особи, якщо платіж на рахунок фізичної особи)"
    CreatePaymentRequest:
      type: object
      required:
        - senderIban
        - receiver
        - destination
        - amount
        - currency
      properties:
        senderIban:
          type: string
          example: UA293220010000026000000000001
          description: IBAN рахунку з якого треба зробити платіж
        receiver:
          $ref: '#/components/schemas/PaymentRequestReceiver'
        destination:
          type: string
          example: "some payment destination"
          description: "Призначення платежу. Для бюджетних платежів призначення має бути спеціального формату: 
          `{payCode з запиту} {additionalInfo з запиту} ЄДРПОУ {ЄДРПОУ вашої компанії}`"
          minLength: 6
          maxLength: 420
        amount:
          type: integer
          format: int64
          description: "Сума операції в мінімальних одиницях валюти (копійках, центах)"
          minimum: 1
          maximum: 10000000000
        currency:
          type: string
          description: Код валюти операції відповідно ISO 4217. На даний момент єдина можлива валюта - 980 (гривня)
          example: '980'
        payCode:
          type: string
          example: "058"
          description: "[Код оплати](https://unifinance.ua/perechen-kodov-vidov-oplat-nalogov/) (необхідний для створення бюджетного платежу)"
          minLength: 3
          maxLength: 3
        additionalInfo:
          type: string
          pattern: .{6,130}
          description: Додаткова інформація платежу (потрібна для створення бюджетного платежу)
        externalReference:
          type: string
          minLength: 3
          maxLength: 256
          description: унікальний ідентифікатор, що встановлюється клієнтом для відстеження платежу у власних системах та пошуку його у виписці
    CreatePaymentResponse:
      type: object
      properties:
        id:
          type: string
          description: "Ідентифікатор платежу"
    GetPaymentStateResponse:
      type: object
      properties:
        id:
          type: string
          description: Ідентифікатор платежу
        state:
          type: string
          enum:
            - DRAFT
            - DECLINED
            - IN_STATEMENT
          description: >
            Поточний стан платежу:
            * `DRAFT` - Платіж створений клієнтом, але ще не відправлений на обробку.
            * `DECLINED` - Підготовлений платіж був відхилений (скасований клієнтом до підписання або з інших причин). Платіж з цим статусом не піде в обробку.
            * `IN_STATEMENT` - Платіж пішов в обробку. Щоб побачити детальний статус транзакції з категорії IN_STATEMENT, використовуйте деталізацію виписки за ідентифікатором транзакції.
    Account:
      type: object
      properties:
        iban:
          type: string
          description: IBAN рахунку
          example: UA293220010000026002700000002
        currency:
          type: integer
          description: Код валюти рахунку згідно зі стандартом ISO 4217 (980 - гривня, 840 - долар США, 978 - євро)
          example: 980
        balance:
          type: number
          description: Поточний баланс рахунку в одиницях відповідної валюти
          example: 42.00
    BalancesResponse:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Дата, на яку вказано баланс у форматі ISO 8601 (YYYY-MM-DD)
          example: "2026-01-15"
        balance:
          type: number
          description: Баланс рахунку на вказану дату в одиницях відповідної валюти
          example: 47.42
        isFinal:
          type: boolean
          description: |
            Прапорець фінальності балансу. Вказує, чи можуть ще відбуватися зміни балансу на вказану дату:
            * `true` - баланс є остаточним, всі операції за цей день проведені, подальші зміни неможливі
            * `false` - баланс може змінитися, оскільки операції за цей день ще обробляються або можуть надійти пізніше
          example: false


