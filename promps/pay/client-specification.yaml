            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/accounts/{IBAN}:
    get:
      tags:
        - account-details
      operationId: get-account
      summary: Отримання рахунку за його IBAN
      parameters:
        - name: IBAN
          in: path
