openapi: 3.0.1
info:
  title: API для роботи з рахунками юридичних осіб
  version: "1.0.2"
  x-logo:
    url: './logo.png'
  description: |
    ## Початок роботи
    Для надання доступу потрібно пройти авторизацію у [web кабінеті](http://web.monobank.ua/?modal=tokens) по обраній компанії та отримати токен для персонального використання.
    Якщо у вас є запитання щодо роботи API, запрошуємо до ком'юніті у [Telegram-групі](https://t.me/joinchat/FiAEWhDf-QzTqM4wzEtffw).
    ## Ліміти на запити
    Для кожного клієнта встановлені ліміти на кількість запитів. Якщо клієнт перевищує ліміт, то він отримає відповідь з помилкою **429 Too Many Requests**. 
    Ліміти встановлені на кожну компанію окремо. Якщо клієнт перевищує ліміт, то він може звернутися до служби підтримки для збільшення ліміту. 
    Поточний ліміт можна побачити в відповіді будь-якого сервіса в заголовку **x-rate-limit-remaining**. 
    Якщо ліміт вичерпаний, то буде повернутий заголовок **x-rate-Limit-retry-after-seconds** з часом (в секундах), через який можна повторити запит.
servers:
  - url: https://corp-api.monobank.ua
    description: Production server
paths:
  /ext/v1/salary-contacts:
    get:
      tags:
        - salary-contacts
      operationId: get-salary-contacts
      summary: Отримання зарплатних контактів з пагінацією
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Максимальна кількість записів у відповіді
          required: false
          schema:
            maximum: 500
            minimum: 1
            type: integer
            format: int32
            default: 100
        - name: offset
          in: query
          description: Зміщення від початку списку результатів
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryContactPageResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - salary-contacts
      operationId: create-salary-contact
      summary: Створення нового зарплатного контакту
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: "Дані нового зарплатного контакту"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryContactRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/salary-contacts/search:
    get:
      tags:
        - salary-contacts
      operationId: search-salary-contacts
      summary: Пошук зарплатних контактів з пагінацією
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: query
          in: query
          description: |
            Пошуковий запит для знаходження контактів. Може містити:
            * ІПН - індивідуальний податковий номер (РНОКПП) контакту, наприклад: "3096889974"
            * Номер документа - серія та номер паспорта або іншого документа, наприклад: "АБ123456"
            * ПІБ - повне ім'я контакту (прізвище, ім'я, по батькові), наприклад: "Петренко Петро Петрович"
            * PAN картки - повний або частковий номер платіжної картки, наприклад: "4149499324892051"
            * IBAN - номер рахунку в форматі IBAN, наприклад: "UA213223130000026007233566001"
          required: false
          schema:
            type: string
            minLength: 3
          examples:
            inn:
              value: "3096889974"
              summary: "Пошук за ІПН"
            iban:
              value: "UA213223130000026007233566001"
              summary: "Пошук за IBAN"
            document:
              value: "АБ123456"
              summary: "Пошук за номером документа"
            fullName:
              value: "Петренко Петро Петрович"
              summary: "Пошук за ПІБ"
            cardPan:
              value: "4149499324892051"
              summary: "Пошук за номером картки"
        - name: limit
          in: query
          description: Максимальна кількість записів у відповіді
          required: false
          schema:
            maximum: 500
            minimum: 1
            type: integer
            format: int32
            default: 100
        - name: offset
          in: query
          description: Зміщення від початку списку результатів
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryContactPageResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/salary-contacts/{id}:
    get:
      tags:
        - salary-contacts
      operationId: get-salary-contact-by-id
      summary: Отримання інформації про зарплатний контакт за ідентифікатором
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Унікальний ідентифікатор контакту
          required: true
          schema:
            type: string
            format: uuid
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryContactResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - salary-contacts
      operationId: delete-salary-contact-by-id
      summary: Видалення зарплатного контакту за ідентифікатором
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Унікальний ідентифікатор контакту
          required: true
          schema:
            type: string
            format: uuid
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/salary-contacts/batch:
    delete:
      tags:
        - salary-contacts
      operationId: delete-salary-contacts-batch
      summary: Видалення зарплатних контактів по їх ідентифікаторах
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: "Список ідентифікаторів контактів для видалення"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSalaryContactsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/payments/salary/registries:
    post:
      tags:
        - salary-registry
      operationId: create-salary-registries
      summary: Створення зарплатної відомості
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: idempotency-key
          in: header
          description: "Параметр потрібен для підтримки ідемпотентності. Якщо виникає будь-яка помилка мережі, запит з однаковим параметром можна повторювати, не боячись створити дублікат. Рекомендується використовувати UUID v4."
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: "Дані нового зарплатного реєстру"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalaryRegistryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryRegistryCreatedResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/payments/salary/registries/types:
    get:
      tags:
        - salary-registry
      operationId: get-salary-registries-types
      summary: Отримання типів зарплатних відомостей
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryRegistryTypeResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/payments/salary/registries/{id}/status:
    get:
      tags:
        - salary-registry
      operationId: get-salary-registries-status
      summary: Отримання статусу зарплатної відомості за її ідентифікатором
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Унікальний ідентифікатор зарплатного реєстру
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryRegistryStatusResponse"
                properties: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/statement/{account}/{from}/{to}:
    get:
      tags:
        - statement-operations
      operationId: get-statement
      summary: Отримання виписки по рахунку
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: account
          in: path
          description: IBAN рахунку по якому треба отримати виписку
          required: true
          example: UA293220010000026000000000001
          schema:
            type: string
        - name: from
          in: path
          description: "Час та дата від яких треба повертати операції в секундах в форматі [Unix time](https://en.wikipedia.org/wiki/Unix_time)"
          required: true
          example: 1719472800
          schema:
            type: integer
            format: int64
        - name: to
          in: path
          description: "Час та дата до яких треба повертати операції в секундах в форматі [Unix time](https://en.wikipedia.org/wiki/Unix_time). 
          Якщо параметр не заданий, то буде підставлено поточний час"
          required: false
          example: 1719472805
          schema:
            type: integer
            format: int64
        - name: direction
          in: query
          description: Сортування. UP - Спочатку повертати нові операції, DOWN - спочатку повертати старі операції
          required: false
          deprecated: true
          schema:
            type: string
            default: DOWN
            enum:
              - UP
              - DOWN
        - name: limit
          in: query
          description: Ліміт операцій, які треба повернути
          required: false
          schema:
            maximum: 500
            minimum: 1
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementItem"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ext/v1/statement:
    get:
      tags:
        - statement-operations
      operationId: get-payment-from-statement
      summary: Отримання інформації по операції за ідентифікатором
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: Ідентифікатор платежу. Обов‘язковий якщо externalReference не заданий
          required: true
          example: 39425792-dd96-4b7d-8f6b-6cd17ec14ecc
          schema:
            type: string
        - name: externalReference
          in: query
          description: Ідентифікатор платежу у системі клієнта. Обов‘язковий якщо id не заданий
          required: true
          example: my-own-pretty-external-reference
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementItem"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /ext/v1/payment/prepare:
    post:
      tags:
        - payment-operations
      operationId: prepare-payment
      summary: Підготувати платіж та відправити на підпис
      requestBody:
        required: true
        description: "Опис платежу, який треба створити"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: idempotency-key
          in: header
          description: "Параметр потрібен для підтримки [ідемпотентності](https://en.wikipedia.org/wiki/Idempotence). 
          Якщо виникає будь-яка помилка мережі, то запит з однаковим параметром **idempotency-key** можна повторювати не 
          боячись створити другий платіж. Клієнт має генерувати унікальне значення параметру для кожного унікального платежу. 
          Алгоритм створення такого ключа клієнт реалізує на свій розсуд, але зі своєї сторони рекомендуємо використовувати 
          [UUID v4](https://en.wikipedia.org/wiki/Universally_unique_identifier)"
          required: true
          schema:
            maxLength: 256
            minLength: 3
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePaymentResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /ext/v1/payment/{id}/state:
    get:
      tags:
        - payment-operations
      operationId: get-payment-state
      summary: Отримання стану платежу за ідентифікатором
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Ідентифікатор платежу
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Дані по платежу знайдені'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPaymentStateResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /ext/v1/payment/state:
    get:
      tags:
        - payment-operations
      operationId: get-payment-state-by-external-reference
      summary: Отримання стану платежу за зовнішнім ідентифікатором
      parameters:
        - name: accept
          in: header
          description: Тип відповіді, який очікує клієнт.
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: x-token
          in: header
          description: Токен доступу до API
          required: true
          schema:
            type: string
        - name: externalReference
          in: query
          description: Ідентифікатор платежу у системі клієнта
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Дані по платежу знайдені'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPaymentStateResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /ext/v1/accounts:
    get:
      tags:
        - account-details
      operationId: get-all-accounts
      summary: Отримання усіх рахунків компанії
      parameters:
