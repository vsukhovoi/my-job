        documentSeries:
          type: string
          description: Серія документа (якщо застосовується)
          example: "АБ"
        iban:
          type: string
          description: IBAN рахунку контакту
          example: "UA293220010000026000000000001"
        pan:
          type: string
          description: Номер картки контакту
          example: "4149499324892051"
    ContactDocument:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/DocumentType"
        series:
          type: string
          description: Серія документа (якщо застосовується)
          example: "АБ"
        number:
          type: string
          description: Номер документа, якщо не вказано ІПН
          example: "123456"
    SalaryRegistryCreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Унікальний ідентифікатор створеного зарплатного реєстру
          example: "123e4567-e89b-12d3-a456-426614174000"
        state:
          type: string
          description: Статус зарплатного реєстру
          example: "SAVED"
        createTimestamp:
          type: string
          format: date-time
          description: Дата та час створення зарплатного реєстру
          example: "2025-08-15T10:30:00Z"
    SalaryRegistryStatusResponse:
      type: object
      properties:
        status:
          type: string
          description: Поточний статус зарплатного реєстру
          example: "FAIL"
          enum:
            - SAVED
            - IN_PROGRESS
            - PREPARED
            - CHANGE_REQUIRED
            - FAIL
            - PAYMENTS_DONE
        updatedAt:
          type: string
          format: date-time
          description: Дата та час останнього оновлення статусу
          example: "2025-08-15T11:45:00Z"
        declineReason:
          type: string
          description: Причина відхилення (якщо статус FAIL)
          example: "Відхилено банком"
    SalaryRegistryTypeResponse:
      type: object
      properties:
        alias:
          type: string
          description: Значення типу зарплатної відомості
          example: "SALARY_ADVANCE"
        description:
          type: string
          description: Опис типу зарплатного реєстру
          example: "Аванс по зарплаті"
    CreateSalaryRegistryRequest:
      type: object
      required:
        - registryName
        - senderIban
        - salaryRegistryType
        - from
        - to
        - recipients
      properties:
        registryName:
          type: string
          description: Назва зарплатного реєстру
          example: "Заробітна плата за серпень 2025"
        senderIban:
          type: string
          description: IBAN рахунку, з якого буде здійснено виплати
          example: "UA293220010000026000000000001"
        salaryRegistryType:
          type: string
          description: Тип зарплатного реєстру. Повний список доступних типів можна отримати в [API типів реєстрів](#tag/salary-registry/operation/get-salary-registries-types)
          example: "salary"
        from:
          type: string
          format: date
          description: Початок періоду, за який здійснюється виплата (формат YYYY-MM-DD)
          example: "2025-08-01"
        to:
          type: string
          format: date
          description: Кінець періоду, за який здійснюється виплата (формат YYYY-MM-DD)
          example: "2025-08-31"
        recipients:
          type: array
          description: Список отримувачів зарплати
          items:
            $ref: "#/components/schemas/SalaryRecipientModel"
    SalaryRecipientModel:
      type: object
      required:
        - fullName
        - iban
        - amount
      properties:
        fullName:
          type: string
          description: Повне ім'я отримувача (прізвище, ім'я, по батькові)
          example: "Петренко Петро Петрович"
        inn:
          type: string
          description: ІПН (РНОКПП) отримувача, якщо не вказано документ
          example: "3096889974"
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type: string
          description: Номер документа, якщо не вказано ІПН
          example: "123456"
        documentSeries:
          type: string
          description: Серія документа (якщо застосовується)
          example: "АБ"
        iban:
          type: string
          description: IBAN рахунку отримувача
          example: "UA213223130000026007233566001"
        amount:
          type: integer
          format: int64
          description: "Сума виплати в мінімальних одиницях валюти (копійках, центах)"
          minimum: 1
          maximum: 10000000000
    BatchPayslipRequest:
      type: object
      required:
        - period
        - employees
      properties:
        period:
          type: string
          format: YearMonth
          description: Період зарплати у форматі YYYY-MM
          example: "2026-01"
        employees:
          type: array
          description: Масив даних по співробітниках
          items:
            $ref: '#/components/schemas/BatchEmployee'
          minItems: 1
          maxItems: 1000
    DeletePayslipsRequest:
      type: object
      required:
        - period
        - identifications
      properties:
        period:
          type: string
          format: YearMonth
          description: Період зарплати у форматі YYYY-MM
          example: "2026-01"
        identifications:
          type: array
          description: Список ідентифікацій співробітників (ІПН або номер паспорта) для видалення
          items:
            type: string
          minItems: 1
          example: ["3262002039", "1234567890"]
    BatchEmployee:
      type: object
      required:
        - identification
        - attributes
      properties:
        identification:
          type: string
          description: ІПН або номер паспорта співробітника
          example: "3262002039"
          minLength: 1
          maxLength: 50
        attributes:
          type: array
          description: Атрибути зарплатного листа (довільні, без валідації по шаблону)
          items:
            $ref: '#/components/schemas/BatchAttribute'
          minItems: 1
    BatchAttribute:
      type: object
      required:
        - attributeName
        - value
        - sortOrder
      properties:
        attributeName:
          type: string
          description: Назва атрибута
          example: "Базова зарплата"
          minLength: 1
        value:
          type: string
          description: Значення атрибута (завжди текст, може бути числом у вигляді тексту)
          example: "50000"
        sortOrder:
          type: integer
          description: Порядок відображення (менше число - вище в списку)
          example: 1
          minimum: 0
        attributeSuffix:
          type: string
          nullable: true
          description: Одиниця виміру або суфікс (наприклад, "грн", "днів", "годин")
          example: "грн"
    BatchPayslipResponse:
      type: object
      required:
        - period
        - status
        - batchStats
        - overallStats
        - failedEmployees
        - createdAt
        - updatedAt
      properties:
        period:
          type: string
          format: YearMonth
          description: Період зарплати
          example: "2026-01"
        status:
          type: string
          enum: [LOADED]
          description: Статус імпорту (завжди LOADED для пакетного API)
        batchStats:
          $ref: '#/components/schemas/BatchStats'
        overallStats:
          $ref: '#/components/schemas/OverallStats'
        failedEmployees:
          type: array
          description: Співробітники, які не вдалося обробити в цьому пакеті
          items:
            $ref: '#/components/schemas/FailedEmployee'
        createdAt:
          type: string
          format: date-time
          description: Дата створення імпорту (перший пакет)
        updatedAt:
          type: string
          format: date-time
          description: Дата останнього оновлення (цей пакет)
    BatchStats:
      type: object
      required:
        - employeesInBatch
        - successInBatch
        - failedInBatch
      properties:
        employeesInBatch:
          type: integer
          description: Унікальних співробітників у цьому пакеті (після видалення дублікатів)
          example: 50
        successInBatch:
          type: integer
          description: Успішно оброблено в цьому пакеті
          example: 49
        failedInBatch:
          type: integer
          description: Помилок в цьому пакеті (співробітник не знайдений)
          example: 1
    OverallStats:
      type: object
      required:
        - totalEmployees
        - totalSuccessEmployees
        - totalFailedEmployees
      properties:
        totalEmployees:
          type: integer
          description: Всього унікальних співробітників за всіма пакетами цього періоду
          example: 100
        totalSuccessEmployees:
          type: integer
          description: Всього успішно оброблених співробітників
          example: 99
        totalFailedEmployees:
          type: integer
          description: Всього співробітників з помилками
          example: 1
    FailedEmployee:
      type: object
      required:
        - identification
        - reason
      properties:
        identification:
          type: string
          description: Ідентифікація співробітника, який не вдалося обробити
          example: "1234567890"
        reason:
          type: string
          description: Причина помилки
          example: "CONTACT_NOT_FOUND"
          enum: [CONTACT_NOT_FOUND]
    ImportStatusResponse:
      type: object
      required:
        - period
        - status
        - totalEmployees
        - totalSuccessEmployees
        - totalFailedEmployees
        - failedEmployees
        - createdAt
        - updatedAt
      properties:
        period:
          type: string
          format: YearMonth
          description: Період зарплати
          example: "2026-01"
        status:
          type: string
          enum: [LOADING, LOADED, FAILED, SENT, DELETED]
          description: Статус імпорту
          example: "LOADED"
        totalEmployees:
          type: integer
          description: Всього співробітників в імпорті
          example: 100
        totalSuccessEmployees:
          type: integer
          description: Успішно оброблених співробітників
          example: 99
        totalFailedEmployees:
          type: integer
          description: Співробітників з помилками
          example: 1
        failedEmployees:
          type: array
          description: Список співробітників, які не вдалося обробити
          items:
            $ref: '#/components/schemas/FailedEmployee'
        createdAt:
          type: string
          format: date-time
          description: Дата створення імпорту
          example: "2026-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Дата останнього оновлення
          example: "2026-01-15T10:35:00Z"
