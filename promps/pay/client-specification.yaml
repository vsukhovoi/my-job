        inn:
          type: string
          description: ІПН (РНОКПП) контакту, якщо не вказано документ
          example: "3096889974"
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type: string
          description: Номер документа, якщо не вказано ІПН
