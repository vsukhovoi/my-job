# Reference nginx config for bot.myjob.co.ua
# Add this server block to aigent nginx (~/aigent/docker/nginx/default.conf)

server {
    listen 443 ssl http2;
    server_name bot.myjob.co.ua;

    # SSL — use existing wildcard or dedicated cert
    # ssl_certificate     /etc/nginx/ssl/myjob.co.ua.crt;
    # ssl_certificate_key /etc/nginx/ssl/myjob.co.ua.key;

    location / {
        proxy_pass         http://myjob-bot:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name bot.myjob.co.ua;
    return 301 https://$server_name$request_uri;
}
